---
layout: default
---
<article class="wrap section post">
  <a class="back-link" href="{{ '/blog/' | relative_url }}">&larr; Back to blog</a>
  <h1>{{ page.title }}</h1>
  <p class="muted post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
  <div class="post-content">
    {{ content }}
  </div>
</article>
