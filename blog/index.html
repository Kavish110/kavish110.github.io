---
layout: default
title: Blog
permalink: /blog/
---
<section class="wrap section">
  <h2>Blog</h2>
  {% if site.posts.size > 0 %}
    <ul class="post-list">
      {% for post in site.posts %}
        <li>
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
          <time class="muted" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="muted">No posts yet &mdash; check back soon.</p>
  {% endif %}
</section>
